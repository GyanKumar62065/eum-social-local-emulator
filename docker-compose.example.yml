# eum-local + LocalStack. Events land in the eum-whatsapp-events SQS queue.
services:
  localstack:
    image: localstack/localstack:4.11.1
    ports: ["4566:4566"]
    environment:
      SERVICES: sns,sqs,s3
      AWS_DEFAULT_REGION: ap-south-1
      ACTIVATE_PRO: 0
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
    volumes:
      - ./docker/localstack-init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health | grep -q '\"sns\": \"\\(running\\|available\\)\"'"]
      interval: 5s
      retries: 30

  eum-local:
    build: .
    ports: ["4580:4580"]
    environment:
      EUM_AWS_ENDPOINT: http://localstack:4566
    volumes:
      - ./eum-local.example.yaml:/etc/eum-local/eum-local.yaml:ro
      - eum-data:/data
    depends_on:
      localstack:
        condition: service_healthy

volumes:
  eum-data: {}
